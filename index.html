display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{grid-template-columns:repeat(4,1fr)}.item{display:flex;gap:12px;align-items:center}.grow{flex:1}.muted{color:var(--muted)}.small{font-size:12px}.tag{display:inline-block;padding:4px 7px;border-radius:6px;background:var(--raised);color:var(--muted);margin:3px}.actions{display:flex;gap:6px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modalbox{width:min(820px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checklist{max-height:300px;overflow:auto}.check{display:flex;gap:8px;padding:8px;background:var(--raised);border-radius:8px;margin:5px 0;align-items:center}.students{grid-template-columns:repeat(3,minmax(0,1fr))}.progress{height:12px;background:var(--raised);border-radius:8px;overflow:hidden}.bar{height:100%;background:var(--amber)}.thumb{width:90px;height:70px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--bg)}.image-preview{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line);object-fit:contain;background:var(--bg)}.sequence{border-left:4px solid var(--steel)}.evalcard{border-left:4px solid var(--amber)}.radar-wrap{display:grid;place-items:center;min-height:340px}.radar{width:min(100%,440px);height:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px;border-bottom:1px solid var(--line);text-align:left}.scroll{overflow:auto}.pill{padding:3px 7px;border-radius:999px;border:1px solid var(--line)}
.subgroup{border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}.subhead{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:11px;border:0;background:var(--raised);color:var(--text)}.subbody{padding:8px}.unit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.fuel-card{background:linear-gradient(180deg,var(--raised),var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px}.fuel-gauge{width:100%;height:auto}.unit-detail{margin-top:8px}.unit-row{display:grid;grid-template-columns:42px 1fr 46px;gap:8px;align-items:center;margin:7px 0}.mini-progress{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}.mini-bar{height:100%;background:var(--steel)}.subresult{margin-left:22px;padding-left:10px;border-left:2px solid var(--line)}.timeline-card{overflow:hidden}.timeline-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.timeline-scroll{overflow-x:auto;padding:8px 2px 18px}.timeline{min-width:1280px;position:relative}.timeline-year{margin-bottom:22px}.timeline-year-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.weeks{display:grid;grid-template-columns:repeat(36,1fr);gap:3px;position:relative}.week{height:76px;border-left:1px solid var(--line);position:relative;background:linear-gradient(to bottom,transparent 50%,rgba(255,255,255,.015) 50%)}.week:nth-child(4n+1){border-left-color:var(--steel)}.week-label{font-size:9px;color:var(--muted);position:absolute;top:2px;left:3px}.event-dot{position:absolute;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--line);background:var(--amber);cursor:pointer;top:28px}.event-dot:hover{transform:translateX(-50%) scale(1.2)}.event-dot.done{background:var(--green)}.event-dot.current{background:var(--amber)}.event-dot.future{background:var(--grey)}.event-stem{position:absolute;left:50%;top:46px;width:1px;height:18px;background:var(--line)}.event-mini{position:absolute;top:62px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--text);width:90px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.semester-band{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-bottom:4px}.semester-band span{text-align:center;font-size:10px;color:var(--muted);border-bottom:3px solid var(--line);padding-bottom:3px}.timeline-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}.eval-detail{display:grid;grid-template-columns:1fr 1fr;gap:12px}.entity-card{transition:.15s;cursor:pointer}.entity-card:hover{border-color:var(--amber);transform:translateY(-1px)}.entity-icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--raised);font-size:24px}.breadcrumb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:14px;color:var(--muted)}.breadcrumb button{border:0;background:none;color:var(--amber);padding:0}.student-avatar{width:58px;height:58px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--amber);border:1px solid var(--line)}.quick-student{cursor:pointer}.quick-student:hover{border-color:var(--amber)}.school-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.school-summary div{background:var(--raised);padding:8px;border-radius:8px;text-align:center}.profile-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}.back-btn{margin-bottom:12px}@media(max-width:800px){.login{grid-template-columns:1fr}.hero{display:none}.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.side button{min-width:max-content}.stats,.grid,.students,.row,.unit-grid,.eval-detail,.school-summary{grid-template-columns:1fr}.main{padding:12p .group-title{margin:22px 0 10px;padding:10px 12px;border-left:4px solid var(--amber);background:var(--raised);border-radius:8px}

.week-grid{display:grid;grid-template-columns:repeat(36,minmax(28px,1fr));gap:3px}

.week-event{display:block;width:100%;margin-top:4px;padding:4px 2px;border:1px solid var(--steel);border-radius:5px;background:var(--panel);color:var(--text);font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.year-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;border:1px solid var(--year-main);background:var(--year-soft);font-size:12px;font-weight:700}
.week-grid,.sequence-track{grid-template-columns:repeat(44,minmax(28px,1fr))}
.week-cell{min-height:64px;position:relative}

.sequence-span.continuation::before{content:"↳ reprise";position:absolute;right:6px;top:5px;z-index:2;padding:2px 5px;border-radius:999px;background:rgba(0,0,0,.55);font-size:9px;color:#fff}

.pfmp-card{border-left:5px solid #8d6cc4;background:linear-gradient(90deg,rgba(141,108,196,.20),var(--panel) 40%)}

.status-scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}

.pfmp-span[draggable="true"]{cursor:grab}

.week-cell.drop-target{outline:2px solid var(--amber)}

.sequence-progress-body{padding:0 10px 10px}

.eval-tree summary{cursor:pointer;padding:7px 4px;font-weight:700}

const SCHOOL_CALENDAR={
 year:'2026-2027',
 start:'2026-08-31',
 weeks:44,
 holidays:[
  {name:'Toussaint',start:'2026-10-17',end:'2026-11-02'},
  {name:'Noël',start:'2026-12-19',end:'2027-01-04'},
  {name:'Hiver',start:'2027-02-06',end:'2027-02-22'},
  {name:'Printemps',start:'2027-04-03',end:'2027-04-19'}
 ],
 noClass:[{name:'Pont du 7 mai',date:'2027-05-07'}]
};
function addDaysISO(iso,days){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function isoWeekInfo(iso){const d=new Date(iso+'T12:00:00'),tmp=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));tmp.setUTCDate(tmp.getUTCDate()+4-(tmp.getUTCDay()||7));const yearStart=new Date(Date.UTC(tmp.getUTCFullYear(),0,1));return {year:tmp.getUTCFullYear(),week:Math.ceil((((tmp-yearStart)/86400000)+1)/7)}}
function schoolWeekInfo(position){
 const monday=addDaysISO(SCHOOL_CALENDAR.start,(Number(position)-1)*7);
 const friday=addDaysISO(monday,4);
 const sunday=addDaysISO(monday,6);
 const iso=isoWeekInfo(monday);
 // Une semaine n'est colorée comme vacances que si ses cinq jours scolaires
 // (lundi à vendredi) sont entièrement compris entre le départ après les cours
 // et la reprise des cours le matin.
 const fullHoliday=SCHOOL_CALENDAR.holidays.find(h=>monday>h.start&&friday<h.end);
 const noClass=SCHOOL_CALENDAR.noClass.find(h=>h.date>=monday&&h.date<=friday);
 return {position:Number(position),monday,friday,sunday,isoWeek:iso.week,isoYear:iso.year,holiday:fullHoliday?.name||'',noClass:noClass?.name||''}
}
function dateToSchoolPosition(iso){
 const start=new Date(SCHOOL_CALENDAR.start+'T12:00:00'),d=new Date(iso+'T12:00:00');
 return Math.max(1,Math.min(SCHOOL_CALENDAR.weeks,Math.floor((d-start)/604800000)+1))
}
function sequenceSchoolId(seq){
 const classId=(seq.classes||[])[0];
 return data.classes.find(c=>c.id===classId)?.schoolId||null
}
function pfmpFor(schoolId,trainingYear){
 return (data.pfmps||[]).find(p=>p.schoolId===schoolId&&Number(p.trainingYear)===Number(trainingYear))
}
function pfmpWeekRange(schoolId,trainingYear){
 const raw=pfmpFor(schoolId,trainingYear);
 if(!raw)return null;
 const p=normalizePfmp(raw);
 const cal=pfmpCalendarWeeks(dateToSchoolPosition(p.startDate),p.durationWeeks);
 return {start:cal.start,end:cal.end,pfmp:p}
}

function pfmpTeachingWeeksBetween(start,end){
 const weeks=[];
 for(let w=Math.max(1,Number(start)||1);w<=Math.min(SCHOOL_CALENDAR.weeks,Number(end)||1);w++){
   if(!schoolWeekInfo(w).holiday)weeks.push(w);
 }
 return weeks
}
function pfmpDuration(p){
 if(!p)return 1;
 if(Number(p.durationWeeks)>0)return Number(p.durationWeeks);
 const start=dateToSchoolPosition(p.startDate),end=dateToSchoolPosition(p.endDate);
 return Math.max(1,pfmpTeachingWeeksBetween(start,end).length);
}
function pfmpCalendarWeeks(start,duration){
 const weeks=[];
 let w=Math.max(1,Math.min(SCHOOL_CALENDAR.weeks,Number(start)||1));
 while(w<=SCHOOL_CALENDAR.weeks&&weeks.length<Math.max(1,Number(duration)||1)){
   if(!schoolWeekInfo(w).holiday)weeks.push(w);
   w++;
 }
 return {weeks,start:weeks[0]||1,end:weeks[weeks.length-1]||1};
}
function pfmpEndDate(startDate,duration){
 const cal=pfmpCalendarWeeks(dateToSchoolPosition(startDate),duration);
 return schoolWeekInfo(cal.end).friday;
}
function normalizePfmp(p){
 const durationWeeks=pfmpDuration(p);
 const startDate=p.startDate||SCHOOL_CALENDAR.start;
 return {...p,startDate,durationWeeks,endDate:pfmpEndDate(startDate,durationWeeks)};
}
function isPfmpWeek(position,schoolId,trainingYear){
 const range=pfmpWeekRange(schoolId,trainingYear),w=Number(position);
 // Une PFMP n'est jamais active pendant une semaine complète de vacances.
 return !!range&&w>=range.start&&w<=range.end&&!schoolWeekInfo(w).holiday
}
function pfmpSegments(schoolId,trainingYear){
 const range=pfmpWeekRange(schoolId,trainingYear);
 if(!range)return [];
 const active=[];
 for(let w=range.start;w<=range.end;w++)if(!schoolWeekInfo(w).holiday)active.push(w);
 if(!active.length)return [];
 const segments=[];let start=active[0],prev=active[0];
 for(const w of active.slice(1)){
   if(w===prev+1){prev=w;continue}
   segments.push({start,end:prev});start=w;prev=w
 }
 segments.push({start,end:prev});
 return segments.map((seg,index)=>({...seg,index,count:segments.length,pfmp:range.pfmp}))
}
function isTeachingWeek(position,schoolId=null,trainingYear=null){
 return !schoolWeekInfo(position).holiday&&!isPfmpWeek(position,schoolId,trainingYear)
}
function nextTeachingWeek(position,schoolId=null,trainingYear=null){
 let w=Math.max(1,Math.min(SCHOOL_CALENDAR.weeks,Number(position)||1));
 while(w<=SCHOOL_CALENDAR.weeks&&!isTeachingWeek(w,schoolId,trainingYear))w++;

}

 const weeks=[];let w=nextTeachingWeek(start,schoolId,trainingYear),guard=0;
 while(weeks.length<Math.max(1,Number(duration)||1)&&w<=SCHOOL_CALENDAR.weeks&&guard<120){
   if(isTeachingWeek(w,schoolId,trainingYear))weeks.push(w);
   w++;guard++
 }
 return weeks
}
function teachingWeeksBetween(start,end,schoolId=null,trainingYear=null){
 const weeks=[];
 for(let w=Math.max(1,Number(start)||1);w<=Math.min(SCHOOL_CALENDAR.weeks,Number(end)||1);w++)if(isTeachingWeek(w,schoolId,trainingYear))weeks.push(w);

}
function sequenceTeachingDuration(seq){
 const schoolId=sequenceSchoolId(seq),year=Number(seq.trainingYear||1);
 return Math.max(1,Number(seq.durationWeeks)||teachingWeeksBetween(seq.startWeek||1,seq.endWeek||seq.startWeek||1,schoolId,year).length)
}
function sequenceCalendarWeeks(start,duration,schoolId=null,trainingYear=null){
 const weeks=teachingWeeksFrom(start,duration,schoolId,trainingYear);
 return {weeks,start:weeks[0]||nextTeachingWeek(start,schoolId,trainingYear),end:weeks[weeks.length-1]||nextTeachingWeek(start,schoolId,trainingYear)}
}
function sequenceSegments(seq){
 const schoolId=sequenceSchoolId(seq),year=Number(seq.trainingYear||1);
 const teaching=teachingWeeksBetween(seq.startWeek||1,seq.endWeek||seq.startWeek||1,schoolId,year);
 if(!teaching.length)return [];
 const segments=[];let a=teaching[0],prev=teaching[0];
 for(const w of teaching.slice(1)){
   if(w===prev+1){prev=w;continue}
   segments.push({start:a,end:prev});a=w;prev=w
 }
 segments.push({start:a,end:prev});

}
function remapEvaluationWeek(oldSeq,newStart,newDuration,oldWeek,newSchoolId=null,newYear=null){
 const oldSchoolId=sequenceSchoolId(oldSeq),oldYear=Number(oldSeq.trainingYear||1);
 const oldWeeks=teachingWeeksBetween(oldSeq.startWeek||1,oldSeq.endWeek||oldSeq.startWeek||1,oldSchoolId,oldYear);
 const schoolId=newSchoolId||oldSchoolId,year=Number(newYear||oldYear);
 const newWeeks=teachingWeeksFrom(newStart,newDuration,schoolId,year);
 if(!newWeeks.length)return nextTeachingWeek(newStart,schoolId,year);

 if(index<0){index=oldWeeks.filter(w=>w<=Number(oldWeek)).length-1;index=Math.max(0,index)}

 return newWeeks[Math.round(ratio*Math.max(0,newWeeks.length-1))]
}
function yearClass(y){return `year-${Number(y||1)}`}
function yearLabel(y){return Number(y)===1?'Seconde':Number(y)===2?'Première':'Terminale'}
function semesterNumber(y,w){return (Number(y||1)-1)*2+(Number(w||1)<=18?1:2)}

function sequenceScheduleLabel(s){const y=Number(s.trainingYear||1),a=Number(s.startWeek||1),b=Number(s.endWeek||a),sa=semesterNumber(y,a),sb=semesterNumber(y,b);return sa===sb?`Année ${y} · semestre ${sa} · semaines ${a} à ${b}`:`Année ${y} · semestres ${sa} à ${sb} · semaines ${a} à ${b}`}
function schoolWeek(dateStr){const d=new Date(dateStr+'T12:00:00'),start=new Date(d.getFullYear()-(d.getMonth()<7?1:0),8,1,12);const diff=Math.floor((d-start)/86400000);return Math.max(1,Math.min(36,Math.floor(diff/7)+1))}
function evalDetail(evalId,studentId=null){const v=data.evals.find(x=>x.id===evalId),seq=data.sequences.find(x=>x.id===v?.sequenceId),rs=studentId?data.results.filter(r=>r.eval===evalId&&r.student===studentId):[];modal(`<div class="titlebar"><div><h2>${esc(v?.title||'Évaluation')}</h2><div class="muted">${v?.date||''} · Séquence : ${esc(seq?.title||'Sans séquence')}</div></div><button class="btn close">Fermer</button></div>${v?.image?`<img class="image-preview" src="${v.image}">`:''}<div class="eval-detail"><div class="card"><h3>Sous-compétences</h3>${(v?.subcomps||v?.comps||[]).map(c=>`<div class="check"><b class="accent">${c}</b><span>${esc(c.includes('.')?SUBLABEL[c]:labels[c])}</span></div>`).join('')}</div><div class="card"><h3>${studentId?'Résultats de l’élève':'Informations'}</h3>${studentId?(rs.length?rs.map(r=>`<div class="check"><b>${r.subcomp||r.comp}</b><span class="grow">${r.status}</span><span class="muted small">${r.date}</span></div>`).join(''):'Aucun résultat saisi.'):`<p>${(v?.classes||[]).map(cid=>data.classes.find(c=>c.id===cid)?.name).filter(Boolean).join(', ')}</p><p class="muted">Créée par ${esc(name(data.teachers.find(t=>t.id===v?.creator)))}</p>`}</div></div>`)}
function packSequenceRows(sequences){
 const sorted=[...sequences].sort((a,b)=>Number(a.startWeek||1)-Number(b.startWeek||1)||Number(a.endWeek||a.startWeek||1)-Number(b.endWeek||b.startWeek||1)||String(a.title||'').localeCompare(String(b.title||'')));

       if(type==='pfmp'){
         const p=(data.pfmps||[]).find(x=>x.id===id);
         if(!p)return;
         const cal=pfmpCalendarWeeks(requestedStart,pfmpDuration(p));
         const startDate=schoolWeekInfo(cal.start).monday;
         savePfmpRecord(normalizePfmp({...p,trainingYear:newYear,startDate}));
         draw();
         return;
       }
       const seq=data.sequences.find(q=>q.id===id);
       if(!seq)return;
       const duration=sequenceTeachingDuration(seq);
       const calendar=sequenceCalendarWeeks(requestedStart,duration,schoolId,newYear);
       const oldSeq={...seq};
       seq.trainingYear=newYear;
       seq.startWeek=calendar.start;
       seq.endWeek=calendar.end;
       seq.durationWeeks=calendar.weeks.length;
       seq.semester=semesterNumber(newYear,calendar.start);
       data.evals=data.evals.map(v=>{
         if(v.sequenceId!==id)return v;
         const week=remapEvaluationWeek(oldSeq,calendar.start,duration,v.week,schoolId,newYear);
         return {...v,trainingYear:newYear,week,semester:semesterNumber(newYear,week)};
       });
       save();
       draw();
     };
   });
 };
 draw();

function savePfmpRecord(x){
 const existing=pfmpFor(x.schoolId,x.trainingYear);
 data.pfmps=existing?data.pfmps.map(p=>p.id===existing.id?x:p):[...(data.pfmps||[]),x];
 // Recalculate sequences and evaluations around both holidays and PFMP.
 data.sequences.filter(seq=>sequenceSchoolId(seq)===x.schoolId&&Number(seq.trainingYear)===Number(x.trainingYear)).forEach(seq=>{
   const old={...seq},duration=sequenceTeachingDuration(old),calendar=sequenceCalendarWeeks(old.startWeek,duration,x.schoolId,x.trainingYear);
   seq.startWeek=calendar.start;seq.endWeek=calendar.end;seq.durationWeeks=calendar.weeks.length;
   data.evals=data.evals.map(v=>{if(v.sequenceId!==seq.id)return v;const week=remapEvaluationWeek(old,seq.startWeek,duration,v.week,x.schoolId,x.trainingYear);return {...v,week,semester:semesterNumber(x.trainingYear,week)}})
 });
 save()
}

   const rs=latestSubcompetencyResults(studentId,code);

                 <div class="status-scale">${STATUS.map(st=>`<button class="status-choice ${normalizeStatus(r?.status)===st?'active':''}" style="background:${statusColor(st)}" data-eval="${v.id}" data-code="${code}" data-st="${st}">${STATUS_SHORT[st]}</button>`).join('')}</div>
               </div>`;
             }).join('')}</div>
           </details>`;
         }).join(''):'<div class="muted">Aucune évaluation dans cette séquence.</div>'}
       </div>
     </div>`;
   }).join('')}</div>`;

   document.querySelectorAll('[data-sequence-open]').forEach(b=>b.onclick=()=>{
     document.getElementById(`sequence-body-${b.dataset.sequenceOpen}`).classList.toggle('hidden');
   });

   document.querySelectorAll('.status-choice').forEach(b=>b.onclick=()=>{
     const evalId=b.dataset.eval,code=b.dataset.code,isSub=code.includes('.'),comp=isSub?code.split('.')[0]:code;
     const old=data.results.find(r=>r.student===sid&&r.eval===evalId&&(isSub?r.subcomp===code:r.comp===code));
     const x={student:sid,eval:evalId,comp,subcomp:isSub?code:null,status:b.dataset.st,teacher:session.user,date:new Date().toISOString().slice(0,10)};
     data.results=old?data.results.map(r=>r===old?x:r):[...data.results,x];
     save();
     renderSequenceList();
     const body=document.getElementById(`sequence-body-${data.evals.find(v=>v.id===evalId)?.sequenceId}`);
     if(body)body.classList.remove('hidden');
   });
 };

 document.querySelectorAll('.cycleYear').forEach(b=>b.onclick=()=>{
   yearFilter=b.dataset.year;
   document.querySelectorAll('.cycleYear').forEach(x=>x.classList.toggle('active',x===b));
   renderSequenceList();
 });
 renderSequenceList();
}
function plannedCodesForYear(studentId,year){
 const student=data.students.find(s=>s.id===studentId);
 const schoolId=data.classes.find(c=>c.id===student?.classId)?.schoolId||student?.schoolId;
 const schoolClasses=data.classes.filter(c=>c.schoolId===schoolId).map(c=>c.id);
 const seqIds=data.sequences
   .filter(seq=>Number(seq.trainingYear||1)===Number(year)&&(seq.classes||[]).some(cid=>schoolClasses.includes(cid)))
   .map(seq=>seq.id);
 return [...new Set(data.evals
   .filter(v=>seqIds.includes(v.sequenceId))
   .flatMap(v=>v.subcomps?.length?v.subcomps:(v.comps||[]))
   .filter(code=>String(code).includes('.')))]
}
function evaluatedCode(studentId,code){
 return latestSubcompetencyResults(studentId,code).length>0
}
function pfmpProgressItems(studentId,years){
 const student=data.students.find(s=>s.id===studentId);
 const schoolId=data.classes.find(c=>c.id===student?.classId)?.schoolId||student?.schoolId;
 const pfmps=(data.pfmps||[]).filter(p=>p.schoolId===schoolId&&years.includes(Number(p.trainingYear)));
 const items=[];
 pfmps.forEach(p=>C.forEach(comp=>['teacher','tutor'].forEach(type=>{
   const r=latestPfmpResultFor(studentId,p.id,comp,type);
   items.push({key:`${p.id}:${comp}:${type}`,done:!!r&&normalizeStatus(r.status)!=='Non évalué'})
 })));
 return items
}
function studentProgressDetails(studentId){
 const currentYear=studentTrainingYear(studentId);
 const yearsToDate=Array.from({length:currentYear},(_,i)=>i+1);

 // Progression annuelle : éléments uniques prévus dans l'année actuelle.
 const annualCodes=plannedCodesForYear(studentId,currentYear);
 const annualPfmp=pfmpProgressItems(studentId,[currentYear]);
 const annualDone=annualCodes.filter(code=>evaluatedCode(studentId,code)).length+annualPfmp.filter(x=>x.done).length;
 const annualTotal=annualCodes.length+annualPfmp.length;

 // Progression globale : éléments uniques du référentiel rencontrés depuis la Seconde,
 // plus les PFMP déjà accessibles. Une même sous-compétence répétée dans dix évaluations
 // ne gonfle donc plus artificiellement le dénominateur.
 const globalCodes=[...new Set(yearsToDate.flatMap(year=>plannedCodesForYear(studentId,year)))];
 const globalPfmp=pfmpProgressItems(studentId,yearsToDate);
 const globalDone=globalCodes.filter(code=>evaluatedCode(studentId,code)).length+globalPfmp.filter(x=>x.done).length;
 const globalTotal=globalCodes.length+globalPfmp.length;

 // Progression instantanée : uniquement les compétences dont au moins un item a commencé.
 const activeComps=C.filter(comp=>{
   const cov=competencyCoverage(studentId,comp);
   return cov.evaluated>0
 });
 const instantItems=activeComps.flatMap(comp=>{
   const school=(SUB[comp]||[]).map(([code])=>({key:code,done:evaluatedCode(studentId,code)}));
   const student=data.students.find(s=>s.id===studentId);
   const schoolId=data.classes.find(c=>c.id===student?.classId)?.schoolId||student?.schoolId;
   const pfmps=(data.pfmps||[]).filter(p=>p.schoolId===schoolId&&Number(p.trainingYear)<=currentYear);
   const pfmp=pfmps.flatMap(p=>['teacher','tutor'].map(type=>{
     const r=latestPfmpResultFor(studentId,p.id,comp,type);
     return {key:`${p.id}:${comp}:${type}`,done:!!r&&normalizeStatus(r.status)!=='Non évalué'}
   }));
   return [...school,...pfmp]
 });
 const instantDone=instantItems.filter(x=>x.done).length;

 return {
   instantPct:instantItems.length?Math.round(100*instantDone/instantItems.length):0,
   annualPct:annualTotal?Math.round(100*annualDone/annualTotal):0,
   globalPct:globalTotal?Math.round(100*globalDone/globalTotal):0,
   instantDone,instantTotal:instantItems.length,
   annualDone,annualTotal,
   globalDone,globalTotal,
   activeSequences:activeComps.length,
   annualSequences:annualCodes.length,
   totalSequences:globalCodes.length,
   currentYear
 }
}

 if(section==='timeline'){shell(title('Ma frise chronologique','Ma frise personnelle, construite à partir de mes évaluations.')+timelineForStudent(s.id));document.querySelectorAll('[data-open-eval]').forEach(b=>b.onclick=()=>evalDetail(b.dataset.openEval,s.id));return}

 const studentClass=data.classes.find(c=>c.id===s.classId),studentSchool=(data.schools||[]).find(x=>x.id===studentClass?.schoolId);
 shell(title(esc(name(s)),`${esc(studentClass?.name||'')} · ${esc(studentSchool?.name||data.school.name)}`,'<button class="btn" id="changeStudent">Changer d’élève</button>')+
 schoolBanner(studentSchool,`${studentClass?.level||''} · ${studentClass?.name||''}`)+
 `<div class="card radar-wrap" style="margin-bottom:12px">${radarSvg(vals,C,'Profil de compétences')}</div>
 <div class="card" style="margin-bottom:12px"><h2>Progression des évaluations</h2><div class="double-progress">

   </div>
   <div class="progress-block">
     <div class="progress-block-head"><b>Progression annuelle</b><b>${progressInfo.annualPct}%</b></div>
     <div class="progress annual"><div class="bar" style="width:${progressInfo.annualPct}%"></div></div>
     <div class="progress-caption">${progressInfo.annualDone}/${progressInfo.annualTotal} items uniques prévus en ${yearLabel(progressInfo.currentYear)}. Une sous-compétence répétée n'est comptée qu'une fois.</div>
   </div>
   <div class="progress-block">
     <div class="progress-block-head"><b>Progression globale</b><b>${progressInfo.globalPct}%</b></div>
     <div class="progress global"><div class="bar" style="width:${progressInfo.globalPct}%"></div></div>
     <div class="progress-caption">${progressInfo.globalDone}/${progressInfo.globalTotal} items uniques rencontrés depuis la Seconde, PFMP comprises.</div>
   </div>
 </div><p class="muted" style="margin-top:10px">${acq} compétences acquises ou maîtrisées sur 13.</p><h3>Compétences C1 à C13</h3><div class="cycle-note">Une compétence reste « Non évalué » tant qu’au moins 50 % de tous ses items n’ont pas été évalués. Les évaluations réalisées en PFMP par le professeur référent et le tuteur sont désormais comptées comme des items supplémentaires.</div>${C.map(c=>{const coverage=competencyCoverage(s.id,c);return `<div class="subgroup"><button class="subhead compOpen" data-open="student-${c}"><b class="accent">${c}</b><span class="grow">${esc(labels[c])}</span><span class="competency-coverage ${coverage.ready?'ready':'pending'}">${coverage.evaluated}/${coverage.total} items · seuil ${coverage.required} <span class="pfmp-count">· PFMP ${coverage.pfmpEvaluated}/${coverage.pfmpTotal}</span></span>${statusPill(latestStatus(s.id,c)||'Non évalué')}</button><div class="subbody hidden" id="student-${c}">${SUB[c].map(([code,label])=>{const rs=data.results.filter(x=>x.student===s.id&&x.subcomp===code),st=rs.length?rs[rs.length-1].status:'Non évalué';return `<div class="check subresult"><b>${code}</b><span class="grow">${esc(label)}</span>${statusPill(st)}</div>`}).join('')}<div class="pfmp-bilan-note"><b>Items PFMP :</b> ${(data.pfmpResults||[]).filter(r=>r.studentId===s.id&&r.comp===c&&normalizeStatus(r.status)!=='Non évalué').map(r=>{const p=(data.pfmps||[]).find(p=>p.id===r.pfmpId);return `${esc(p?.label||'PFMP')} — ${r.assessorType==='teacher'?'professeur':'tuteur'} : ${esc(normalizeStatus(r.status))}`}).join(' · ')||'aucune évaluation PFMP pour cette compétence'}</div></div></div>`}).join('')}</div>
 <div class="card" style="margin-bottom:12px"><h2>Unités certificatives du diplôme</h2>${unitCardsForStudent(s.id)}</div>`);
 document.getElementById('changeStudent').onclick=()=>{session=null;login()};

}

data.pfmps=(data.pfmps||[]).map(normalizePfmp);data.pfmpResults=data.pfmpResults||[];
login();
